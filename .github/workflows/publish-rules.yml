# Publishes firestore.rules and storage.rules to the candoni-archives Firebase project whenever they
# change on main, so the live rules always match the code. Run it by hand too: Actions → Publish
# Firebase rules → Run workflow.
#
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT: the JSON key of a Google Cloud service
# account with the roles Firebase Rules Admin, Firebase Viewer and Service Usage Consumer
# (README → "Publishing the rules automatically").
name: Publish Firebase rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - storage.rules
      - firebase.json
      - .github/workflows/publish-rules.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-firebase-rules
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check the service account secret is set
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The secret FIREBASE_SERVICE_ACCOUNT is not set. See README → Publishing the rules automatically."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sign in to Google Cloud as the service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Publish firestore.rules and storage.rules
        run: npx -y firebase-tools@15.34.1 deploy --only firestore:rules,storage --project candoni-archives --non-interactive
